const c=e.querySelector(".cur");if(c)e.scrollLeft=c.offsetLeft-60;document.querySelectorAll(".tu").forEach(b=>b.disabled=G.over||G.ix==0);document.querySelectorAll(".tr").forEach(b=>b.disabled=G.over||G.ix>=G.tl.length-1)}
function dlg(h,p,btns){$("#ov").innerHTML=`<div class="ov"><div class="dlg"><h2>${h}</h2><p>${p}</p><div class="row">${btns.map((b,i)=>`<button class="btn" data-i="${i}">${b[0]}</button>`).join("")}</div></div></div>`;
$("#ov").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;const i=b.dataset.i;$("#ov").innerHTML="";btns[i][1]()}}

function fin(win,why){G.over=true;clearInterval(timer);S.st.g++;if(win=="w")S.st.w++;else if(win=="b")S.st.b++;else S.st.d++;
S.hist.unshift({w:G.n[0],b:G.n[1],r:win||"d",n:G.ix,d:Date.now()});S.hist=S.hist.slice(0,15);save();

function sfx(k){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=k=="cp"?190:k=="ck"?520:320;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.12);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.13)}catch(e){}if(navigator.vibrate)navigator.vibrate(8)}
function caps(){const I2={p:8,n:2,b:2,r:2,q:1},VL={p:1,n:3,b:3,r:5,q:9},c={w:{},b:{}},o={w:"",b:""},sc={w:0,b:0};
for(const p of cs().b)if(p){const l=p.toLowerCase(),k=isW(p)?"w":"b";c[k][l]=(c[k][l]||0)+1}
for(const l of"qrbnp")for(const k of["w","b"]){const m=Math.max(0,I2[l]-(c[k][l]||0)),x=k=="w"?"b":"w";for(let j=0;j<m;j++)o[x]+=pc(k=="w"?l.toUpperCase():l,"sm");sc[x]+=m*VL[l]}
const d=sc.w-sc.b;if($("#k0"))$("#k0").innerHTML=o.w+(d>0?`<small>+${d}</small>`:"");if($("#k1"))$("#k1").innerHTML=o.b+(d<0?`<small>+${-d}</small>`:"")}
function board(){if(!$("#bd"))return;const e=G.tl[G.ix],s=e.s,ck=inChk(s)?ksq(s.b,s.t=="w"):-1,lm=e.lm;let h="";
for(let k=0;k<64;k++){const i=G.flip?63-k:k,p=s.b[i],mv=S.hint?G.mv.find(x=>x.t==i):null,gh=dr&&dr.mv&&dr.i==i;
h+=`<div class="sq ${((i>>3)+(i&7))%2?"d":"l"}${lm&&(lm.f==i||lm.t==i)?" lm":""}${G.sel==i?" sel":""}${i==ck?" ck":""}${mv?(p||mv.ep?" mv cp":" mv"):""}" data-q="${i}">${S.crd&&(k&7)==0?`<i class="cr">${8-(i>>3)}</i>`:""}${S.crd&&k>55?`<i class="cf">${"abcdefgh"[i&7]}</i>`:""}${p?`<span class="p${gh?" gh":""}">${pc(p)}</span>`:""}</div>`}

function tap(m,an=true){if(m[0].p){const w=cs().t=="w";return dlg(t("pro"),"",["q","r","b","n"].map(q=>[`<span class="pr">${pc(w?q.toUpperCase():q)}</span>`,()=>play(m.find(x=>x.p==q),an)]))}play(m[0],an)}
function play(mv,an=true){const o=cs(),w=o.t=="w",n=mk(o,mv),pl=o.b[mv.f].toLowerCase(),cap=o.b[mv.t]||mv.ep,lg=legal(n),ck=inChk(n);

const san=mv.cs?((mv.t&7)==6?"O-O":"O-O-O"):(pl=="p"?"":pl.toUpperCase())+sqn(mv.f)+(cap?"x":"-")+sqn(mv.t)+(mv.p?"="+mv.p.toUpperCase():"")+(ck?(lg.length?"+":"#"):"");
G.tl=G.tl.slice(0,G.ix+1);G.tl.push({s:n,lm:mv,san,tm:G.tm.slice()});G.ix++;G.sel=null;G.mv=[];G.last=Date.now();
sfx(ck?"ck":cap?"cp":"mv");board();if(an)slide(mv);clocks();moves();
if(!lg.length)return fin(ck?(w?"w":"b"):null,ck?"mate":"stale");
const k=key(n),ps=n.b.filter(x=>x&&x.toLowerCase()!="k");
if(G.tl.filter(x=>key(x.s)==k).length>=3)fin(null,"rep");else if(n.hm>=100)fin(null,"fifty");else if(!ps.length||(ps.length==1&&/[nb]/i.test(ps[0])))fin(null,"mat")}
function jump(j){if(!G||G.over||j<0||j>=G.tl.length)return;G.ix=j;G.tm=G.tl[j].tm.slice();G.sel=null;G.mv=[];G.last=Date.now();board();clocks();moves()}

if(p&&isW(p)===(s.t=="w")){G.sel=i;G.mv=legal(s).filter(x=>x.f==i);dr={i,x:e.clientX,y:e.clientY,mv:false,p}}else{G.sel=null;G.mv=[]}board()});
document.addEventListener("pointermove",e=>{if(!dr)return;if(!dr.mv){if(Math.hypot(e.clientX-dr.x,e.clientY-dr.y)<8)return;dr.mv=true;const z=$("#bd .sq").offsetWidth,f=document.createElement("div");f.id="fl";f.style.width=f.style.height=z+"px";f.innerHTML=pc(dr.p);document.body.appendChild(f);board()}
const f=$("#fl"),z=f.offsetWidth;f.style.left=e.clientX-z/2+"px";f.style.top=e.clientY-z*1.35+"px"});

const el=document.elementFromPoint(e.clientX,e.clientY),q=el&&el.closest("#bd .sq"),m=q?G.mv.filter(x=>x.t==+q.dataset.q):[];if(m.length)tap(m,false);else board()});
document.addEventListener("click",e=>{const j=e.target.closest("[data-j]");if(j&&G)return jump(+j.dataset.j);
const a=e.target.closest("[data-a]");if(!a)return;const x=a.dataset.a,v=a.dataset.v;if($("#bn"))cfg.bn=$("#bn").value;if($("#wn"))cfg.wn=$("#wn").value;
if(x=="ok"){const n=$("#nm").value.trim();if(!n)return $("#nm").focus();S.name=n;save();return go("home")}
else if(x=="tab")return go(v);else if(x=="setup")return go("setup");else if(x=="m")cfg.m=+v;else if(x=="i")cfg.i=+v;else if(x=="play")return start();
else if(x=="lang"||x=="theme"||x=="board"){S[x]=v;save()}else if(x=="tg"){S[v]=S[v]?0:1;save()}
else if(x=="rename"){const n=$("#pn").value.trim();if(n){S.name=n;save()}}else if(x=="reset"){S.st={g:0,w:0,b:0,d:0};S.hist=[];save()}
else if(x=="undo")return jump(G.ix-1);else if(x=="redo")return jump(G.ix+1);else if(x=="flip"){G.flip=!G.flip;return render()}
else if(x=="draw"){const sd=+v,o=G.n[1-sd];return dlg(t("qd"),G.n[sd]+" → "+o,[[t("no"),()=>{}],[t("ok"),()=>dlg(o+": "+t("draw")+"?","",[[t("no"),()=>{}],[t("ok"),()=>{if(!G.over)fin(null,"agr")}]])]])}
else if(x=="resign"){const sd=+v;return dlg(t("qr"),G.n[sd],[[t("no"),()=>{}],[t("ok"),()=>{if(!G.over)fin(sd?"w":"b","res")}]])}
else if(x=="nav")return go(v);else if(x=="back")return NAVN>1?history.back():go(S.name?"set":"onb");
else if(x=="photo")return sheet([[I.cam,t("cam"),()=>$("#fc").click()],[I.img,t("gal"),()=>$("#fg").click()]].concat(S.photo?[[I.trash,t("del"),()=>{delete S.photo;save();render()}]]:[]));
else if(x=="wipe")return dlg(t("wipeq"),t("wipes"),[[t("no"),()=>{}],[t("ok"),()=>{try{localStorage.removeItem("ouwds")}catch(e){}Object.assign(S,{name:"",theme:"auto",board:"dusk",snd:1,hint:1,crd:1,st:{g:0,w:0,b:0,d:0},hist:[]});delete S.photo;go("onb")}]]);
else if(x=="more")return sheet([[I.flip,t("flip"),()=>{G.flip=!G.flip;render()}],[I.exit,t("exit"),()=>dlg(t("qe"),"",[[t("no"),()=>{}],[t("ok"),()=>{clearInterval(timer);G=null;go("home")}]])]]);
render()});
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest(".btn,.chip,.hero:not(.off),.tool,.tile,#dock button");if(!b||b.disabled)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,p=document.createElement("i");p.className="rp";p.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(p);setTimeout(()=>p.remove(),650);if(navigator.vibrate)navigator.vibrate(6)});
