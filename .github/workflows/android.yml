name: android
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Salin web ke assets
        run: mkdir -p android/app/src/main/assets && cp web/index.html android/app/src/main/assets/index.html
      - name: Build APK debug
        shell: bash
        run: |
          set +e
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "What went wrong|error:|e: |FAILED|Could not|not found|Execution failed" -A4 build.log | head -c 3800 | tr '\n' '|')
            echo "::error title=gradle gagal::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ouwds-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
